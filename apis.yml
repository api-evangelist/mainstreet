aid: mainstreet
name: MainStreet
description: 'MainStreet is a US small-business tax-credit and back-office platform
  that identifies, calculates, and files R&D tax credits alongside a client''s CPA.
  Its service covers qualified research expense (QRE) identification under IRC §41,
  the IRS four-part test, business-component documentation, Form 6765 preparation
  (including the mandatory Section G component-level reporting that begins with tax
  years starting after 31 December 2025), the §41(h) payroll-tax offset for
  pre-revenue startups, and state R&D credits across 30+ states. Beyond R&D it claims
  SECURE Act retirement-plan credits, the Small Business Health Care Tax Credit, and
  the Disabled Access Credit, and it sells adjacent back-office services — entity
  formation, banking, expense tracking, and bookkeeping and tax filing. MainStreet
  was founded in 2019 as a venture-backed R&D tax-credit fintech and was acquired by
  Employer.com in May 2025; the brand now operates as part of that back-office suite.
  MainStreet ships no public product API, developer portal, or OpenAPI definition —
  it is an API consumer (payroll data via Finch, document generation via Anvil) rather
  than an API producer. Its only public machine-readable contract is the OpenID
  Connect and RFC 8414 discovery pair served by its identity host.'
