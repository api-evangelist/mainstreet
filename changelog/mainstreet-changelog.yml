- id: pricing-flexible-2026
  date: '2026-06-24'
  category: Pricing
  title: 'More flexible pricing: pick the structure that fits your business'
  summary: >-
    Clients can now choose how they pay for an R&D engagement: 15% success-based
    (no credit, no fee), Pay in Full for the lowest effective rate, 12
    interest-free monthly payments, or a Flat-Fee option with tiered discounts
    and up to a 3-year rate lock. Every option includes up to $1M in audit
    support and protection.
  breaking: false
  link: https://mainstreet.ai/pricing.html
- id: section-g-2026
  date: '2026-06-20'
  category: Compliance
  title: Getting clients ready for mandatory Form 6765 Section G in 2026
  summary: >-
    For tax years beginning after 31 December 2025, Section G business-component-level
    reporting becomes mandatory for most filers. MainStreet updated its process to
    capture component-level QRE detail in every engagement. Exemptions still apply
    for qualified small businesses electing the payroll offset and for filers under
    the $1.5M QRE and $50M gross-receipts tests on an original return.
  breaking: false
  link: https://mainstreet.ai/irs-rules.html
